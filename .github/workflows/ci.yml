name: CI

# Phase 0 of the Android-parity plan: this repository had no CI at all, and
# `main` shipped in a state that did not compile.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26, not macos-15: this project's deployment target is 26.5, and the
    # macos-15 images top out at Xcode 26.3 / SDK 26.3. A deployment target
    # newer than the SDK cannot build, which is what the first run hit.
    runs-on: macos-26

    # Whether the tests can run at all comes down to whether this repository
    # has an Apple signing identity. See the "Test" step for why.
    env:
      # A **Developer ID Application** identity, not a development one.
      # Development profiles carry an explicit device list, and GitHub's
      # runners are ephemeral and unregistered, so signing with one fails:
      # "provisioning profile ... doesn't include the currently selected
      # device". Developer ID is the one macOS type that provisions all
      # devices. See KyPost/KyPost_CI.entitlements.
      SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # This project needs Xcode 26 — README pins the deployment target at
        # macOS/iOS 26.5. The first cut selected `/Applications/Xcode_16.app`,
        # which exists on the image and builds nothing here: xcodebuild exited
        # 70 rather than saying the SDK was too old.
        #
        # Chosen by globbing rather than a literal path, because the images
        # carry several 26.x and rename them as they update; pinning an exact
        # one means CI breaks on an image refresh rather than on a code change.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner image; this project cannot build without one."
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

          # Check the SDK actually satisfies the deployment target, and say so
          # plainly if it does not. Without this the failure is `xcodebuild`
          # exiting 70 with no indication that the toolchain is the problem —
          # which is exactly how the first run read.
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          TARGET=$(grep -m1 -oE 'MACOSX_DEPLOYMENT_TARGET = [0-9.]+' \
            KyPost.xcodeproj/project.pbxproj | grep -oE '[0-9.]+$')
          echo "macOS SDK $SDK, deployment target $TARGET"
          if [ "$(printf '%s\n%s\n' "$TARGET" "$SDK" | sort -V | tail -1)" != "$SDK" ]; then
            echo "::error::macOS SDK $SDK is older than this project's deployment target $TARGET. Use a runner image carrying Xcode $TARGET or newer."
            exit 1
          fi

      - name: Install signing identity
        # Only when the secrets are configured; see "Compile only" below.
        if: env.SIGNING_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt no one can answer, and
          # the job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db


      - name: Test
        if: env.SIGNING_CERTIFICATE != ''
        # Unit tests only: the UI target drives a real app instance, is flaky
        # headless, and is not what protects this code.
        #
        # No pretty-printer in the pipeline. `| xcpretty` swallowed the real
        # exit status behind a tool that is not guaranteed on the image, and a
        # formatter is not worth a build step that can fail for its own reasons.
        # Signed with Developer ID and the CI entitlements, which drop
        # aps-environment so no push-capable profile is needed. Manual style
        # with an empty profile specifier: automatic signing would go looking
        # for a development profile again and fail on the device list.
        run: |
          .github/scripts/run-xcodebuild.sh test \
            -scheme KyPost \
            -destination 'platform=macOS' \
            -only-testing:"KyPost Tests" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=KyPost/KyPost_CI.entitlements

      - name: Compile only (no signing identity configured)
        if: env.SIGNING_CERTIFICATE == ''
        # The tests cannot run on a stock runner, and this is not a workflow
        # bug that more flags will fix. They run inside the host app, the host
        # app's entitlements include `keychain-access-groups`, and
        # KeychainStorage uses the data-protection keychain — which returns
        # errSecMissingEntitlement (-34018) to a process that does not carry
        # that entitlement. Measured, not assumed: building with
        # CODE_SIGNING_ALLOWED=NO produces 140 tests failing on -34018.
        #
        # Nor can the entitlement be ad-hoc signed. Xcode refuses outright:
        # "has entitlements that require signing with a development
        # certificate". `keychain-access-groups` needs a real identity, which
        # is why the Test step above signs with Developer ID.
        #
        # So without secrets this compiles instead — which still catches the
        # failure mode that caused this workflow to be written, `main` not
        # building. It must not be mistaken for a passing test suite, hence
        # the notice.
        run: |
          set -euo pipefail
          echo "::notice::No Apple signing identity configured, so the test suite did NOT run — this check compiled the code only. Set MACOS_SIGNING_CERTIFICATE (a Developer ID Application .p12, base64) and MACOS_SIGNING_CERTIFICATE_PASSWORD to run the tests."
          .github/scripts/run-xcodebuild.sh build-for-testing \
            -scheme KyPost \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Remove the signing keychain
        # `always()`: a keychain holding the signing identity should not
        # outlive the job even when the job failed.
        if: always() && env.SIGNING_CERTIFICATE != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/ci.provisionprofile
