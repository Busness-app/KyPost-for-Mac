name: CI

# Phase 0 of the Android-parity plan: this repository had no CI at all, and
# `main` shipped in a state that did not compile.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26, not macos-15: this project's deployment target is 26.5, and the
    # macos-15 images top out at Xcode 26.3 / SDK 26.3. A deployment target
    # newer than the SDK cannot build, which is what the first run hit.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # This project needs Xcode 26 — README pins the deployment target at
        # macOS/iOS 26.5. The first cut selected `/Applications/Xcode_16.app`,
        # which exists on the image and builds nothing here: xcodebuild exited
        # 70 rather than saying the SDK was too old.
        #
        # Chosen by globbing rather than a literal path, because the images
        # carry several 26.x and rename them as they update; pinning an exact
        # one means CI breaks on an image refresh rather than on a code change.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner image; this project cannot build without one."
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

          # Check the SDK actually satisfies the deployment target, and say so
          # plainly if it does not. Without this the failure is `xcodebuild`
          # exiting 70 with no indication that the toolchain is the problem —
          # which is exactly how the first run read.
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          TARGET=$(grep -m1 -oE 'MACOSX_DEPLOYMENT_TARGET = [0-9.]+' \
            KyPost.xcodeproj/project.pbxproj | grep -oE '[0-9.]+$')
          echo "macOS SDK $SDK, deployment target $TARGET"
          if [ "$(printf '%s\n%s\n' "$TARGET" "$SDK" | sort -V | tail -1)" != "$SDK" ]; then
            echo "::error::macOS SDK $SDK is older than this project's deployment target $TARGET. Use a runner image carrying Xcode $TARGET or newer."
            exit 1
          fi

      - name: Test
        # No pretty-printer in the pipeline. `| xcpretty` swallowed the real
        # exit status behind a tool that is not guaranteed on the image, and a
        # formatter is not worth a build step that can fail for its own reasons.
        #
        # Unit tests only: the UI target drives a real app instance, is flaky
        # headless, and is not what protects this code.
        #
        # The output is teed and, on failure, replayed as `::error::`
        # annotations. This is not decoration: job logs are readable only with
        # admin rights on the repository, so to anyone else a red run says
        # nothing but "exit 65". Annotations are readable by anyone who can see
        # the run, so the reason for a failure travels with it.
        shell: bash
        run: |
          # `-e` is on by default in this shell, so the failing xcodebuild has
          # to be caught by `||` or the step dies before it can report anything.
          set -uo pipefail
          STATUS=0
          xcodebuild test \
            -scheme KyPost \
            -destination 'platform=macOS' \
            -only-testing:"KyPost Tests" \
            2>&1 | tee /tmp/xcodebuild.log || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            annotate() {
              # GitHub reads a literal newline as the end of the command, so
              # multi-line context has to be encoded.
              # awk, not sed: BSD sed on the macOS runner rejects the usual
              # newline-slurping one-liner.
              printf '::error::%s\n' \
                "$(printf '%s' "$1" | awk 'BEGIN{ORS=""} NR>1{print "%0A"} {print}')"
            }
            # Compile/link/signing errors first: these explain everything after.
            grep -E '(^|[[:space:]])error:|^error:' /tmp/xcodebuild.log \
              | sort -u | head -10 | while IFS= read -r line; do annotate "$line"; done
            # Then failing tests, which are the other reason to be here.
            grep -E '✘|Testing failed:|^[[:space:]]+[A-Za-z_]+Tests\.' /tmp/xcodebuild.log \
              | sort -u | head -10 | while IFS= read -r line; do annotate "$line"; done
            annotate "xcodebuild exited $STATUS. Last 40 lines:%0A$(tail -40 /tmp/xcodebuild.log)"
          fi
          exit "$STATUS"
