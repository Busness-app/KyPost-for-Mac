name: Build GopenPGP XCFramework

# Produces the binary this app links, from source, on GitHub's runners — so the
# artifact in a mail client's crypto path has a build log anyone can read
# rather than having been produced on someone's laptop.
#
# GopenPGP publishes no release assets of its own; Proton builds its Apple
# framework in-house. This workflow is that step, made public.
#
# **It runs upstream's own `build.sh`** rather than reimplementing the gomobile
# invocation. The first attempt here did reimplement it and got three things
# wrong that the build script encodes: gomobile has to be installed *into the
# gopenpgp module* (otherwise `x/mobile` is not in its dependency graph and the
# bind refuses), the framework binds six packages rather than just `crypto`,
# and it needs `-tags mobile,ios`. Calling their script means their packaging
# decisions cannot drift away from ours.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "gopenpgp tag to build (defaults to Dependencies/gopenpgp.env)"
        required: false
  push:
    # A change to the pinned version is the trigger. Nothing else rebuilds it:
    # a binary that silently changes is one nobody reviewed.
    paths:
      - Dependencies/gopenpgp.env
      - .github/workflows/gopenpgp-xcframework.yml

permissions:
  contents: write

jobs:
  build:
    # Pinned, not `macos-latest`: that label moves between images and this job
    # depends on the toolchain it finds.
    runs-on: macos-15
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          path: kypost

      - name: Resolve pinned version
        id: pin
        run: |
          set -euo pipefail
          source kypost/Dependencies/gopenpgp.env
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$GOPENPGP_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ProtonMail/gopenpgp at $VERSION"

      - name: Checkout gopenpgp
        uses: actions/checkout@v5
        with:
          repository: ProtonMail/gopenpgp
          ref: ${{ steps.pin.outputs.version }}
          path: gopenpgp

      # Deliberately *not* pinning Xcode. Upstream's workflow pins 16.0.0,
      # which this job copied and which then failed outright — the runner image
      # it lands on need not carry that exact version, and pinning one that is
      # absent breaks on an image refresh rather than on a change to this code.
      # gomobile binds against whatever SDK the default toolchain provides, and
      # an older SDK with a newer deployment target is the ordinary direction.

      - uses: actions/setup-go@v5
        with:
          go-version: "^1.22"
          cache: false

      - name: Build with upstream's script
        working-directory: gopenpgp
        run: |
          set -euo pipefail
          chmod +x build.sh
          # `apple` builds ios,iossimulator,macos into dist/apple. This app is
          # macOS/iOS universal, and a framework missing a slice fails at link
          # time on whichever platform was omitted rather than here.
          ./build.sh apple
          find dist -maxdepth 3

      - name: Package and checksum
        id: package
        run: |
          set -euo pipefail
          cd gopenpgp/dist/apple
          # Zipped from inside dist/apple so the archive root is the
          # .xcframework itself, which is what an SPM binaryTarget expects.
          zip -qry "$GITHUB_WORKSPACE/gopenpgp.xcframework.zip" gopenpgp.xcframework
          cd "$GITHUB_WORKSPACE"
          # An SPM binaryTarget checksum is a plain SHA-256 of the zip, so this
          # is verifiable without any Swift tooling.
          SHA=$(shasum -a 256 gopenpgp.xcframework.zip | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### GopenPGP ${{ steps.pin.outputs.version }}"
            echo
            echo "Pin these two in \`Package.swift\`:"
            echo '```'
            echo "url:      <the release asset URL below>"
            echo "checksum: $SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        working-directory: kypost
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="gopenpgp-$VERSION"
          ASSET="$GITHUB_WORKSPACE/gopenpgp.xcframework.zip"
          # Quoted delimiter: the body is written verbatim, so backticks and
          # $ in it are not shell-interpreted. The values come in as env vars
          # rather than inline expressions for the same reason.
          cat > "$RUNNER_TEMP/notes.md" <<'NOTE'
          Built from ProtonMail/gopenpgp using that repository's own
          `build.sh apple`.

          SPM binaryTarget checksum (SHA-256 of the zip):
          NOTE
          {
            echo
            echo "    $SHA256"
            echo
            echo "Version: \`$VERSION\`  ·  Workflow run: $RUN_ID"
            echo
            echo "Rebuild and compare hashes to verify — this workflow plus"
            echo "upstream's build.sh are the whole recipe."
          } >> "$RUNNER_TEMP/notes.md"

          # Idempotent: re-running the same version replaces the asset rather
          # than failing, so a workflow fix does not need a version bump.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "GopenPGP $VERSION (XCFramework)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
