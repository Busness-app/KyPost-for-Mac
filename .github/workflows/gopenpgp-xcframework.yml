name: Build GopenPGP XCFramework

# Produces the binary this app links, from source, on GitHub's runners — so the
# artifact in a mail client's crypto path has a build log anyone can read
# rather than having been produced on someone's laptop.
#
# GopenPGP publishes no release assets of its own; Proton builds its iOS
# framework in-house the same way. This workflow is that step, made public.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "gopenpgp tag to build (defaults to Dependencies/gopenpgp.env)"
        required: false
  push:
    # A change to the pinned version is the trigger. Nothing else rebuilds it:
    # a binary that silently changes is one nobody reviewed.
    paths:
      - Dependencies/gopenpgp.env
      - .github/workflows/gopenpgp-xcframework.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned version
        id: pin
        run: |
          set -euo pipefail
          source Dependencies/gopenpgp.env
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$GOPENPGP_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$GOPENPGP_BIND_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Building $GOPENPGP_BIND_PACKAGE at $VERSION"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: false

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build XCFramework
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/bind"
          mkdir -p "$WORK" && cd "$WORK"
          go mod init kypost.local/gopenpgpbind
          go get "${{ steps.pin.outputs.package }}@${{ steps.pin.outputs.version }}"
          gomobile init
          # macos first: this app is macOS/iOS universal, and a framework
          # missing a slice fails at link time on whichever platform was
          # omitted rather than at build time here.
          gomobile bind \
            -target=macos,ios,iossimulator \
            -iosversion=15.0 \
            -o "$GITHUB_WORKSPACE/Gopenpgp.xcframework" \
            -v "${{ steps.pin.outputs.package }}"

      - name: Package and checksum
        id: package
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -qry Gopenpgp.xcframework.zip Gopenpgp.xcframework
          # Swift Package Manager's binaryTarget checksum is a plain SHA-256 of
          # the zip, so this is verifiable without any Swift tooling.
          SHA=$(shasum -a 256 Gopenpgp.xcframework.zip | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### GopenPGP ${{ steps.pin.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "checksum: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gopenpgp-${{ steps.pin.outputs.version }}"
          NOTES="Built by \`${{ github.workflow }}\` run ${{ github.run_id }} from
          \`${{ steps.pin.outputs.package }}@${{ steps.pin.outputs.version }}\`.

          SPM binaryTarget checksum (SHA-256 of the zip):

              ${{ steps.package.outputs.sha256 }}

          Rebuild and compare hashes to verify: the workflow file is the whole
          recipe."
          # Idempotent: a re-run of the same version replaces the asset rather
          # than failing, so a workflow fix does not need a version bump.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Gopenpgp.xcframework.zip --clobber
          else
            gh release create "$TAG" Gopenpgp.xcframework.zip \
              --title "GopenPGP ${{ steps.pin.outputs.version }} (XCFramework)" \
              --notes "$NOTES"
          fi
